[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "julianverse-account"
version = "0.1.0"
description = "Julianverse Account, OpenID Connect and optional ownCloud sync"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-Migrate>=4.1,<5",
  "Flask-WTF>=1.2,<2",
  "Authlib>=1.8,<2",
  "cryptography>=45",
  "httpx>=0.28,<1",
  "requests>=2.32,<3",
  "pyotp>=2.9,<3",
  "webauthn>=2.2,<3",
  "email-validator>=2,<3",
  "qrcode>=8,<9",
  "gunicorn>=23",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.22", "ruff>=0.12"]

[tool.setuptools.packages.find]
include = ["account*"]

[tool.setuptools.package-data]
account = ["templates/*.html", "static/*", "static/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
