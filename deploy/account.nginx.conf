# Managed by Julianverse Account: scripts/setup-nginx.sh
server {
    listen 80;
    server_name account.julianverse.de;
    return 301 https://account.julianverse.de$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name account.julianverse.de;

    ssl_certificate /etc/letsencrypt/live/account.julianverse.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/account.julianverse.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    # OAuth codes and email recovery tokens must not appear in access logs.
    access_log off;
    error_log /var/log/nginx/julianverse-account.error.log crit;

    # Nginx connection errors show a maintenance message until the app starts.
    # Upstream application errors retain their original JSON/body.
    error_page 502 504 =503 @account_pending;
    location @account_pending {
        default_type text/plain;
        add_header Retry-After 60 always;
        add_header X-Julianverse-Setup pending always;
        return 503 "Julianverse Account wird gerade eingerichtet. Bitte versuche es spaeter erneut.\n";
    }

    # Julianverse News sync
    location = /api/sync/news {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host account.julianverse.de;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    location ^~ /api/sync/news/ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host account.julianverse.de;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host account.julianverse.de;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }
}
